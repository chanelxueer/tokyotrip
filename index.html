.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.dn{display:block;text-decoration:none;color:var(--db);background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px}.dn:hover{background:var(--bei)}
.dn b{font:600 22px "Cormorant Garamond",serif;color:var(--ac)}.dn small{display:block;color:var(--lb)}
.warn{background:var(--warn);border-left:4px solid var(--lb);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.tl{position:relative;margin-left:8px;padding-left:20px;border-left:2px solid var(--oat)}
.st{position:relative;margin:0 0 6px}.st::before{content:"";position:absolute;left:-27px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--lb)}
.tm{font:600 14px "Cormorant Garamond",serif;color:var(--lb);letter-spacing:.08em}
.st h3{font-size:19px}.meta{font-size:13px;color:var(--lb)}
.btn,button{font:inherit;font-size:13px;background:var(--bei);color:var(--db);border:1px solid var(--oat);border-radius:99px;padding:5px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.p,button.p{background:var(--db);color:var(--bg)}
.cn{margin:2px 0 10px;font-size:13px;color:var(--lb);padding:2px 0}

table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}.sc{overflow-x:auto}
.ms{columns:2 150px;gap:10px}.ms img{width:100%;border-radius:12px;margin:0 0 10px;cursor:zoom-in;display:block}
@media(min-width:700px){.ms{columns:3}}

.big{font:600 26px "Cormorant Garamond",serif}

<div class="row">${i>1&&i<11?`<a class="btn" href="#day-${i-1}">← 前一天</a>`:''}${i<10?`<a class="btn p" href="#day-${i+1}">下一天 →</a>`:''}</div>`}
function fd(f,D){return `<div style="padding:8px 0;border-bottom:1px solid var(--ln)"><b>${E(f[0])}</b> <a class="btn" target="_blank" rel="noopener" href="${U(f[0].split('：').pop()+' '+D.t)}">地圖</a><br><span class="meta">營業：${E(f[1])}｜公休：見營業欄，其餘待確認｜價格：待確認｜交通：待確認</span><br>推薦：${E(f[2])}</div>`}
function food(){return `<p class="sub">RESTAURANTS</p><h1>餐廳專區</h1><div class="warn">以下為 PDF 內的餐廳。營業時間以 PDF 為準，未寫者標「待確認」，出發前請在 Google Maps 查證。</div>${TRIP.days.map((D,i)=>D.f.length?`<div class="card"><h2>${dl(i+1)} ${E(D.t)}</h2>${D.f.map(f=>fd(f,D)).join('')}</div>`:'').join('')}`}
function budget(){const B=L('b',{rate:35,cap:0,pn:['我','男友'],it:[],ed:-1}),cats=['機票','租車','住宿','ETC／高速公路費','油錢','餐飲','購物','景點門票','其他'];
const my=x=>x.c=='JPY'?x.a/B.rate:x.a,tot=B.it.reduce((s,x)=>s+my(x),0),by=(f)=>B.it.reduce((o,x)=>(o[f(x)]=(o[f(x)]||0)+my(x),o),{}),bc=by(x=>x.k),bp=by(x=>x.p),e=B.ed>=0?B.it[B.ed]:{k:cats[0],n:'',a:'',c:'JPY',p:0};
const sv=()=>S('b',B);window.bs=()=>{B.rate=+$('#rt').value||35;B.cap=+$('#cp').value||0;B.pn=[$('#p0').value||'我',$('#p1').value||'男友'];sv();budget_()};
window.ba=()=>{const a=+$('#am').value;if(!(a>0))return alert('請輸入金額');const x={k:$('#ct').value,n:$('#nt').value,a,c:$('#cu').value,p:+$('#py').value};if(B.ed>=0){B.it[B.ed]=x;B.ed=-1}else B.it.push(x);sv();budget_()};
window.bd=i=>{if(confirm('刪除這筆？')){B.it.splice(i,1);B.ed=-1;sv();budget_()}};window.be=i=>{B.ed=i;sv();budget_();scrollTo(0,0)};
return `<p class="sub">BUDGET</p><h1>旅行預算</h1><div class="card"><div class="row">1 MYR ＝ <input id="rt" type="number" step="0.01" value="${B.rate}" style="width:80px"> JPY（請自行更新匯率）</div><div class="row">總預算 RM <input id="cp" type="number" value="${B.cap}" style="width:110px">　付款人 <input id="p0" value="${E(B.pn[0])}" style="width:80px"><input id="p1" value="${E(B.pn[1])}" style="width:80px"><button onclick="bs()">儲存設定</button></div></div>
<div class="card"><h2>${B.ed>=0?'修改支出':'新增支出'}</h2><div class="row"><select id="ct">${cats.map(c=>`<option ${c==e.k?'selected':''}>${c}</option>`).join('')}</select><input id="nt" placeholder="備註" value="${E(e.n)}"><input id="am" type="number" placeholder="金額" value="${e.a}" style="width:110px"><select id="cu"><option ${e.c=='JPY'?'selected':''}>JPY</option><option ${e.c=='MYR'?'selected':''}>MYR</option></select><select id="py">${B.pn.map((n,i)=>`<option value="${i}" ${i==e.p?'selected':''}>${E(n)} 付款</option>`).join('')}</select><button class="p" onclick="ba()">${B.ed>=0?'更新':'新增'}</button>${B.ed>=0?'<button onclick="B_c()">取消</button>':''}</div></div>
<div class="card"><div class="big">RM ${tot.toFixed(2)}</div><div class="meta">≈ ¥${Math.round(tot*B.rate).toLocaleString()}｜預算 RM ${B.cap.toFixed(2)}｜${B.cap?(B.cap-tot>=0?'尚餘 RM '+(B.cap-tot).toFixed(2):'超支 RM '+(tot-B.cap).toFixed(2)):'請設定總預算'}</div><p class="meta">${B.pn.map((n,i)=>E(n)+'已付 RM '+(bp[i]||0).toFixed(2)).join('｜')}${B.it.length&&B.pn.length==2?`｜結算：${(bp[0]||0)>(bp[1]||0)?E(B.pn[1])+'給'+E(B.pn[0]):E(B.pn[0])+'給'+E(B.pn[1])} RM ${Math.abs(((bp[0]||0)-(bp[1]||0))/2).toFixed(2)}`:''}</p>
<div class="sc"><table>${cats.map(c=>`<tr><td>${c}</td><td>RM ${(bc[c]||0).toFixed(2)}</td></tr>`).join('')}</table></div></div>
<div class="card sc"><table>${B.it.map((x,i)=>`<tr><td>${E(x.k)}<br><small>${E(x.n)}</small></td><td>${x.c=='JPY'?'¥':'RM '}${x.a}<br><small>RM ${my(x).toFixed(2)}・${E(B.pn[x.p]||'')}</small></td><td><button onclick="be(${i})">改</button> <button onclick="bd(${i})">刪</button></td></tr>`).join('')||'<tr><td>尚無支出</td></tr>'}</table></div>`}
window.B_c=()=>{const B=L('b',{});B.ed=-1;S('b',B);budget_()};
const budget_=()=>{app.innerHTML=budget()};
async function idbx(m,f){const d=await new Promise((r,j)=>{const q=indexedDB.open('tj',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id',autoIncrement:true});q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});return new Promise((r,j)=>{const t=d.transaction('p',m),q=f(t.objectStore('p'));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>j(t.error)})}
let PF='all';
async function photos(){let ps=[];try{ps=await idbx('readonly',s=>s.getAll())}catch(e){}
const sh=ps.filter(p=>PF=='all'||p.day==PF);
app.innerHTML=`<p class="sub">PHOTO ALBUM</p><h1>旅行相簿</h1><div class="card"><div class="row"><select id="pd">${TRIP.days.slice(0,10).map((d,i)=>`<option value="${i+1}">DAY ${i+1}</option>`).join('')}</select><input id="pf" type="file" accept="image/*" multiple><button class="p" onclick="pu()">上傳</button></div><p class="meta">相片只存在這支手機／這個瀏覽器，不會同步給另一個人。</p></div><div class="row"><button onclick="PF='all';photos()">全部</button>${TRIP.days.slice(0,10).map((d,i)=>`<button onclick="PF=${i+1};photos()">D${i+1}</button>`).join('')}</div><div class="ms">${sh.map(p=>`<img data-id="${p.id}" alt="DAY ${p.day}">`).join('')||'<p>還沒有照片</p>'}</div>`;
app.querySelectorAll('img[data-id]').forEach(im=>{const p=ps.find(x=>x.id==im.dataset.id);im.src=URL.createObjectURL(p.b);im.onclick=e=>{const l=$('#lb');l.innerHTML='';const g=document.createElement('img');g.src=im.src;const b=document.createElement('button');b.textContent='刪除這張';b.onclick=async ev=>{ev.stopPropagation();if(confirm('刪除？')){await idbx('readwrite',s=>s.delete(p.id));l.style.display='none';photos()}};l.append(g,b);l.style.display='flex'}})}
window.pu=async()=>{const fs=[...$('#pf').files];if(!fs.length)return alert('請先選擇照片');const day=+$('#pd').value;for(const f of fs){try{const bm=await createImageBitmap(f),k=Math.min(1,1400/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));await idbx('readwrite',s=>s.add({day,b}))}catch(e){alert('有照片無法上傳')}}photos()};
function list(){let C=L('c',CK);const sv=()=>S('c',C);window.ct=i=>{C[i].d=!C[i].d;sv();list_()};window.cd=i=>{C.splice(i,1);sv();list_()};window.ca=()=>{const t=$('#ci').value.trim();if(!t)return;C.push({g:$('#cg').value,t,d:0});sv();list_()};
const gs=[...new Set(C.map(x=>x.g))],done=C.filter(x=>x.d).length;
return `<p class="sub">CHECKLIST</p><h1>旅行清單</h1><p class="meta">完成 ${done}／${C.length}</p><div class="card"><div class="row"><select id="cg">${gs.map(g=>`<option>${E(g)}</option>`).join('')}</select><input id="ci" placeholder="新增項目"><button class="p" onclick="ca()">新增</button></div></div>${gs.map(g=>`<div class="card"><h2>${E(g)}</h2>${C.map((x,i)=>x.g==g?`<div class="ck ${x.d?'d':''}"><input type="checkbox" ${x.d?'checked':''} onchange="ct(${i})"><span style="flex:1">${E(x.t)}</span><button onclick="cd(${i})">刪</button></div>`:'').join('')}</div>`).join('')}`}
const list_=()=>{app.innerHTML=list()};
function weather(){return `<p class="sub">WEATHER</p><h1>天氣資訊</h1><div class="warn">本站不顯示即時數據（避免出現不準確資料）。請用下方連結查看當地最新天氣、降雪機率、風速與警報。</div><div class="row"><a class="btn p" target="_blank" rel="noopener" href="https://www.jma.go.jp/bosai/warning/">日本氣象廳 天氣警報</a><a class="btn" target="_blank" rel="noopener" href="https://tenki.jp/">tenki.jp</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent('富士山 ライブカメラ')}">富士山即時畫面</a></div>${WX.map(w=>`<div class="card"><h2>${w[0]}</h2><div class="row"><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(w[1]+' weather')}">天氣・氣溫</a><a class="btn" target="_blank" rel="noopener" href="https://www.windy.com/${w[2]}/${w[3]}?${w[2]},${w[3]},10">風速・降雪（Windy）</a></div></div>`).join('')}`}
function route(keep){const h=(location.hash||'#home').slice(1),m=h.match(/^day-(\d+)$/),id=m?'day-1':h;
$('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==id?'on':''}">${n[1]}</a>`).join('')+`<a href="#" onclick="tgl();return false" class="${EM?'on':''}">✎ ${EM?'編輯中':'編輯行程'}</a>`;
if(m&&+m[1]>=1&&+m[1]<=10)app.innerHTML=day(+m[1]);else if(h=='alt')app.innerHTML=day(11);else if(h=='food')app.innerHTML=food();else if(h=='budget')budget_();else if(h=='photos')photos();else if(h=='list')list_();else if(h=='weather')app.innerHTML=weather();else app.innerHTML=home();if(!keep)scrollTo(0,0)}
addEventListener('hashchange',()=>{ES=-1;route()});route();
